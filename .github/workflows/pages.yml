name: Deploy to GitHub Pages

# The site is a Vite build, so Pages must publish dist/, not the repository root.
# Repository Settings → Pages → Source must be "GitHub Actions" for this to run.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Refuse private modules in the public build
        run: test ! -e local

      - name: Install dependencies
        run: npm ci

      - name: Verify engines before publishing
        run: npm test

      - name: Build for a project sub-path
        run: npm run build
        env:
          VITE_BASE: /agentuto/

      - name: Check bundle budgets
        run: npm run check:bundle

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
