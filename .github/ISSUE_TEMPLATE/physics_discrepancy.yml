name: "Faculty & Mathematical Discrepancy"
description: "Report a physics or mathematical error in ODEs, units, sign conventions, or telemetry"
title: "[Physics]: "
labels: ["physics-review", "faculty"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us maintain mathematical and scientific rigor (Constitution Art. 1).
  - type: dropdown
    id: sandbox
    attributes:
      label: Affected Sandbox
      options:
        - lorentz-force (MIT 8.02 / UTSG PHY152)
        - harmonic-oscillator (MIT 18.03 / UTSG MAT244)
        - lorenz-attractor (MIT 18.03)
        - faraday-induction (MIT 8.02 / UTSG PHY152)
        - maxwell-boltzmann (MIT 8.044 / UTSG PHY252)
        - quantum-tunneling (MIT 8.04 / UTSG PHY256)
        - wave-optics (MIT 8.03 / UTSG PHY152)
        - kepler-orbits (MIT 8.01 / UTSG PHY151)
        - projectile-drag (MIT 8.01 / UTSG PHY151)
        - lcr-circuit (MIT 8.02 / UTSG PHY152)
        - standing-waves (MIT 8.03 / UTSG PHY152)
        - doppler-shift (MIT 8.03 / UTSG PHY152)
        - photoelectric-effect (MIT 8.04 / UTSG PHY256)
        - carnot-cycle (MIT 8.044 / UTSG PHY252)
        - gauss-flux (MIT 8.02 / UTSG PHY152)
        - conservation-momentum (MIT 8.01 / UTSG PHY151)
        - rc-rl-circuits (MIT 8.02 / UTSG PHY152)
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: Discrepancy Description
      description: What is mathematically or physically inaccurate in the engine, formula, units, or text?
      placeholder: "e.g., In RC charging, the formula for stored energy is..."
    validations:
      required: true
  - type: textarea
    id: citation
    attributes:
      label: Mathematical Derivation or Citation
      description: Cite the textbook, peer-reviewed source, or derivation confirming the correct result.
      placeholder: "e.g., MIT OpenCourseWare 8.02, Lecture 12 / Halliday & Resnick 11th Ed. Eq. 27-29"
    validations:
      required: true
