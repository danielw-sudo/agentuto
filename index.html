<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentuto — Interactive Science Sandbox</title>
    <script>try{let t=localStorage.getItem('agentuto.theme.v1'),d=document.documentElement;t==='dark'||t==='contrast'?d.setAttribute('data-theme',t):t==='auto'?d.removeAttribute('data-theme'):d.setAttribute('data-theme','light')}catch{document.documentElement.setAttribute('data-theme','light')}</script>
  </head>
  <body class="bg-paper text-ink overflow-hidden select-none m-0 p-0 h-screen w-screen">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
